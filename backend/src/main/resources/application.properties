
spring.application.name=event-manager

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/event_manager}
spring.datasource.username=${DB_USERNAME:event_manager}
spring.datasource.password=${DB_PASSWORD:event_manager_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:event_manager}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:event_manager_dev}

# API
server.port=8080

# RabbitMQ - Consumer Retry
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms

# Não recolocar mensagens rejeitadas na fila principal
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# RabbitMQ - Publisher Confirms and Returns
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true