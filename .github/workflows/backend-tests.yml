name: Backend tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: event_manager
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d event_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci-password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/event_manager
          DB_USERNAME: ci
          DB_PASSWORD: ci-password
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          RABBITMQ_USERNAME: ci
          RABBITMQ_PASSWORD: ci-password
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

      - name: Add coverage to job summary
        if: always()
        run: |
          report="backend/target/site/jacoco/jacoco.xml"
          if [ ! -f "$report" ]; then
            echo "JaCoCo report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - "$report" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          counters = {counter.attrib["type"]: counter.attrib for counter in root.findall("counter")}

          def percentage(counter):
              values = counters.get(counter)
              if values is None:
                  return "N/A"
              missed = int(values["missed"])
              covered = int(values["covered"])
              total = missed + covered
              return f"{covered / total * 100:.1f}%" if total else "N/A"

          print("## Backend test coverage")
          print()
          print("| Metric | Coverage |")
          print("| --- | ---: |")
          print(f"| Instructions | {percentage('INSTRUCTION')} |")
          print(f"| Branches | {percentage('BRANCH')} |")
          print(f"| Lines | {percentage('LINE')} |")
          PY

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 30
